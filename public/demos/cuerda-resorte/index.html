<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../_brand/fonts/fonts.css"><title>Tirador — interruptor de tema con cuerda (componente web)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#efe9dd}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}</style></head>
<body><canvas id="c" role="img" aria-label="Interruptor de tema: una cuerda con cuentas que se tira hacia abajo para cambiar entre día y noche"></canvas>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
/* acabado: grano de película (24 fps), viñeta, micro-shake de impacto */
let _g;const grain=(x,w,h,t,a=.09)=>{if(!_g){_g=document.createElement('canvas');_g.width=_g.height=180;const g=_g.getContext('2d'),d=g.createImageData(180,180),r=rng(9);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=r()*255|0;d.data[i+3]=255}g.putImageData(d,0,0)}
 const r=rng(Math.floor(t*24)+1),ox=r()*180|0,oy=r()*180|0;x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';x.translate(-ox,-oy);x.fillStyle=x.createPattern(_g,'repeat');x.fillRect(ox,oy,w,h);x.restore()};
const vig=(x,w,h,a=.5)=>{const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,w,h)};
const film=t=>{const e=document.getElementById('film');if(e){const r=rng(Math.floor(t*24)+3);e.style.backgroundPosition=`${r()*220|0}px ${r()*220|0}px`}};
const shake=(t,t0,a=6,d=.3)=>{const k=S(t0,t0+d,t);if(k<=0||k>=1)return[0,0];const e=(1-k)*(1-k)*a;return[Math.sin(k*67)*e,Math.cos(k*59)*e]};
const FONTS=()=>document.fonts?Promise.all(['300 40px Display','italic 300 40px Display','500 20px Sans'].map(f=>document.fonts.load(f,'AÁaáÍí0'))):Promise.resolve();
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;
FONTS().then(()=>{window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)})}
const cv=document.getElementById('c'),VW=1600,VH=900,HX=1180,HY=64,N=24,SEG=17,FN='ui-sans-serif,system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif';
const TH=[{bg:'#e9e3d6',ink:'#15141a',card:'#ddd5c4',ac:'#c4421d',word:'Día'},{bg:'#0d0c11',ink:'#e8e1d2',card:'#17151d',ac:'#c9a96a',word:'Noche'}];
const AUTO=[[1.3,2.2,132],[5.2,6.1,132]],eP=bez(.3,0,.2,1),eI=bez(.7,0,.15,1);
const rn=rng(4),stars=Array.from({length:46},()=>[rn()*VW,70+rn()*520,.6+rn()*1.8,rn()*6.28]);
let P,hy,hv,clk,toggles,grab,prevGrab,pull,px,ptr,lastUse=-1e9,hover=false,liveT=0,lastNow=0;
const reset=()=>{P=Array.from({length:N},(_,i)=>({x:HX,y:HY+i*SEG,ox:HX,oy:HY+i*SEG}));hy=0;hv=0;clk=0;toggles=[];grab=false;prevGrab=false;pull=0;px=HX};reset();
const autoAt=ph=>{for(const[a,b,p]of AUTO)if(ph>=a&&ph<b)return{g:true,pull:p*eP(S(a,b-.05,ph)),px:HX+36*Math.sin(S(a,b,ph)*3.2)};return{g:false}};
const live=!/[?&]cap/.test(location.search)&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
function step(dt){clk+=dt;const idle=!ptr||performance.now()-lastUse>2600||!live;
 if(idle){const a=autoAt(clk%8);grab=a.g;if(a.g){pull=a.pull;px=a.px}}
 if(grab)hy+=(pull-hy)*Math.min(1,dt*28),hv=0;else{hv+=(-300*hy-12*hv)*dt;hy+=hv*dt}
 if(prevGrab&&!grab&&hy>78){const b=P[N-1];toggles.push({t:clk,x:b.x,y:b.y+20})}
 prevGrab=grab;
 P[0].x=HX;P[0].y=HY+hy;
 for(let i=1;i<N;i++){const p=P[i],vx=(p.x-p.ox)*.992,vy=(p.y-p.oy)*.992;p.ox=p.x;p.oy=p.y;p.x+=vx+Math.sin(clk*1.3+i*.2)*.012;p.y+=vy+.125}
 if(grab)P[N-1].x+=(px-P[N-1].x)*Math.min(1,dt*6);
 for(let k=0;k<12;k++){P[0].x=HX;P[0].y=HY+hy;for(let i=1;i<N;i++){const a=P[i-1],b=P[i];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-SEG)/d;if(i===1){b.x-=dx*f;b.y-=dy*f}else{a.x+=dx*f*.5;a.y+=dy*f*.5;b.x-=dx*f*.5;b.y-=dy*f*.5}}}}
function scene(x,th,par,sw){
 x.fillStyle=th.bg;x.fillRect(0,0,VW,VH);
 const dark=th===TH[1];
 if(dark){stars.forEach(s=>{x.globalAlpha=.35+.45*Math.sin(clk*1.5+s[3]);x.fillStyle=th.ink;x.beginPath();x.arc(s[0]-par*.02,s[1],s[2],0,6.283);x.fill()});x.globalAlpha=1}
 // astro (capa media, paralaje)
 x.save();x.translate(430-par*.06,330);x.fillStyle=th.ac;
 if(dark){x.beginPath();x.arc(0,0,190,0,6.283);x.fill();x.fillStyle=th.bg;x.beginPath();x.arc(78,-44,168,0,6.283);x.fill()}
 else{x.beginPath();x.arc(0,0,150,0,6.283);x.fill();x.strokeStyle=th.ac;x.lineWidth=4;x.lineCap='round';for(let i=0;i<16;i++){const a=i*Math.PI/8+clk*.2,l=i%2?34:58;x.beginPath();x.moveTo(Math.cos(a)*188,Math.sin(a)*188);x.lineTo(Math.cos(a)*(188+l),Math.sin(a)*(188+l));x.stroke()}}
 x.restore();
 // palabra (capa frontal)
 x.fillStyle=th.ink;x.font='italic 300 400px Display,serif';x.textBaseline='alphabetic';x.fillText(th.word,86-par*.1,812);
 // panel de interfaz + interruptor-estado
 x.fillStyle=th.card;x.beginPath();x.roundRect(1010-par*.04,650,500,200,22);x.fill();
 x.fillStyle=th.ink;x.globalAlpha=.22;[[1050,686,300],[1050,718,220],[1050,750,260]].forEach(b=>{x.beginPath();x.roundRect(b[0]-par*.04,b[1],b[2],14,7);x.fill()});x.globalAlpha=1;
 x.fillStyle=th.ac;x.beginPath();x.roundRect(1050-par*.04,786,128,40,20);x.fill();
 const kx=1050+(sw)*60;x.fillStyle=th.bg;x.beginPath();x.arc(kx+20-par*.04+0,806,15,0,6.283);x.fill();
 // cabecera
 x.fillStyle=th.card;x.fillRect(0,0,VW,HY);x.fillStyle=th.ac;x.beginPath();x.arc(52,32,12,0,6.283);x.fill();x.fillStyle=th.ink;x.globalAlpha=.3;[96,176,256].forEach(v=>{x.beginPath();x.roundRect(v+18,26,56,12,6);x.fill()});x.globalAlpha=1}
play(8000,t=>{
 const[x,w,h]=fit(cv),sc=Math.min(w/VW,h/VH);
 if(live){const n=performance.now(),dt=Math.min(.05,(n-(lastNow||n))/1000);lastNow=n;let r=dt;while(r>1e-6){const d=Math.min(r,1/120);step(d);r-=d}}
 else{if(t/1000<clk-.01)reset();while(clk<t/1000-1e-6)step(1/120)}
 x.save();x.translate((w-VW*sc)/2,(h-VH*sc)/2);x.scale(sc,sc);x.beginPath();x.rect(0,0,VW,VH);x.clip();
 const B=P[N-1],par=B.x-HX,cur=toggles.length%2,lt=toggles[toggles.length-1],age=lt?clk-lt.t:9,swv=cur*1;
 const sw=lt?(age<.9?(cur?eP(age/.9):1-eP(age/.9)):cur):0;
 if(lt&&age<.95){scene(x,TH[1-cur],par,1-cur);x.save();x.beginPath();x.arc(lt.x,lt.y,eI(age/.95)*2100,0,6.283);x.clip();scene(x,TH[cur],par,sw);x.restore()}else scene(x,TH[cur],par,cur);
 const th=TH[cur],tr=lt&&age<.95?eI(age/.95)>.5?TH[cur]:TH[1-cur]:th;
 // sombra proyectada de la cuerda sobre la pared (profundidad)
 const pts=[[HX,HY+4],...P.map(p=>[p.x,p.y])];x.lineCap='round';x.lineJoin='round';
 [[34,38,.1,16],[24,28,.12,11]].forEach(([dx,dy,a,wd])=>{x.strokeStyle=`rgba(0,0,0,${a})`;x.lineWidth=wd;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0]+dx-par*.0,p[1]+dy):x.moveTo(p[0]+dx,p[1]+dy));x.stroke()});
 // alojamiento y cuerda trenzada
 x.fillStyle=tr.ac;x.beginPath();x.roundRect(HX-24,HY-6,48,20,8);x.fill();x.fillStyle='rgba(0,0,0,.25)';x.fillRect(HX-24,HY+8,48,3);
 x.strokeStyle=tr.ink;x.lineWidth=9;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
 x.strokeStyle=tr.bg;x.globalAlpha=.5;x.lineWidth=9;x.setLineDash([3,6]);x.lineDashOffset=-hy*.2;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.setLineDash([]);x.globalAlpha=1;
 // cuenta (tirador)
 const a=P[N-2],dx=B.x-a.x,dy=B.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,ex=B.x+ux*34,ey=B.y+uy*34,tn=C(hy/78);
 x.strokeStyle='rgba(0,0,0,.2)';x.lineWidth=30;x.beginPath();x.moveTo(B.x+30,B.y+34);x.lineTo(ex+30,ey+34);x.stroke();
 x.strokeStyle=tr.ac;x.lineWidth=34;x.beginPath();x.moveTo(B.x,B.y);x.lineTo(ex,ey);x.stroke();
 x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=6;x.beginPath();x.moveTo(B.x-6-uy*0+0,B.y+4);x.lineTo(ex-6,ey-4);x.stroke();
 // estado: anillo de tensión hasta el umbral
 const hot=grab||hover;if(hot||tn>0){x.strokeStyle=tr.ac;x.globalAlpha=.25+.75*tn;x.lineWidth=4;x.beginPath();x.arc((B.x+ex)/2,(B.y+ey)/2,34+tn*6,-Math.PI/2,-Math.PI/2+6.283*tn);x.stroke();x.globalAlpha=1}
 x.restore();vig(x,w,h,.45);grain(x,w,h,clk,.09)},{replay:false,hold:0,still:4000});
// puntero / táctil
const toV=e=>{const r=cv.getBoundingClientRect(),sc=Math.min(r.width/VW,r.height/VH);return[(e.clientX-r.left-(r.width-VW*sc)/2)/sc,(e.clientY-r.top-(r.height-VH*sc)/2)/sc]};
let down=false,y0=0;
cv.addEventListener('pointermove',e=>{const v=toV(e),b=P[N-1];hover=Math.hypot(v[0]-b.x,v[1]-(b.y+17))<46;cv.style.cursor=hover||down?'grab':'default';if(!down)return;lastUse=performance.now();ptr=v;px=v[0];pull=C(v[1]-y0,0,150);grab=true});
cv.addEventListener('pointerdown',e=>{const v=toV(e),b=P[N-1];if(Math.hypot(v[0]-b.x,v[1]-(b.y+17))<56){down=true;cv.setPointerCapture(e.pointerId);y0=v[1]-hy;ptr=v;lastUse=performance.now();grab=true;pull=hy}});
const up=()=>{if(!down)return;down=false;grab=false;lastUse=performance.now()};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
</script></body></html>
