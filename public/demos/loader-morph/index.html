<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morph — loader con forma que se llena</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#ece8df}svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#n{position:absolute;left:0;right:0;bottom:11%;text-align:center;font:700 clamp(28px,9vmin,84px)/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:#141414;letter-spacing:-.04em}</style></head>
<body>
<svg id="s" viewBox="0 0 1600 900" role="img" aria-label="Una forma cambia de silueta mientras se llena como un indicador de carga">
<defs><clipPath id="cp"><path id="cpp"/></clipPath></defs>
<g transform="translate(800 400)">
 <path id="ghost" fill="none" stroke="#141414" stroke-opacity=".14" stroke-width="2"/>
 <g clip-path="url(#cp)"><rect x="-300" y="-300" width="600" height="600" fill="#f6b8a8"/><path id="w2" fill="#ff7a5c"/><path id="w1" fill="#ff4b2b"/></g>
 <path id="out" fill="none" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
 <circle id="rp" r="0" fill="none" stroke="#ff4b2b" stroke-width="4" opacity="0"/>
 <path id="ck" d="M-62 4L-20 46L68 -46" fill="none" stroke="#ece8df" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</g></svg>
<div id="n" aria-hidden="true">000</div>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)}
const $=id=>document.getElementById(id),M=96,A=Array.from({length:M},(_,i)=>i/M*6.2832);
const polar=(f)=>A.map(a=>f(a));
const tri=a=>{const k=((a+1.5708)%2.0944+2.0944)%2.0944-1.0472;return 1/Math.cos(k)*.5*1.0}; // triángulo (apotema .5)
const shapes=[
 polar(a=>1),
 polar(a=>{const c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));return 1/Math.pow(Math.pow(c,5)+Math.pow(s,5),.2)*.86}),
 polar(a=>tri(a)*1.45),
 polar(a=>1+.0*a-.34*Math.pow(Math.abs(Math.cos(2*a)),.8)*-1*0+(.12-.3*Math.pow(Math.abs(Math.sin(2*a)),1.6)))
];
const R=190,ease=bez(.75,0,.15,1);
const path=(r,rot,sc)=>'M'+r.map((v,i)=>{const a=A[i]+rot;return(Math.cos(a)*v*R*sc).toFixed(1)+' '+(Math.sin(a)*v*R*sc).toFixed(1)}).join('L')+'Z';
const SEG=[0,.9,1.8,2.7,3.6]; // cada .9s cambia de silueta; la 5ª vuelve al círculo
const prog=t=>{ // avance con pausas "reales": 0→23, 23→61, 61→87, 87→100
 const k=[[0,0],[.5,.0],[1.2,23],[1.7,23],[2.6,61],[3.0,61],[4.0,87],[4.5,87],[5.3,100],[8,100]];
 for(let i=1;i<k.length;i++)if(t<=k[i][0]){const p=S(k[i-1][0],k[i][0],t);return L(k[i-1][1],k[i][1],bez(.4,0,.2,1)(p))}return 100};
const dr=bez(.6,0,.2,1);
play(7300,t=>{t/=1000;
 const si=Math.min(4,Math.floor(t/.9)),f=ease(S(si*.9+.05,si*.9+.85,t)),a=shapes[si%4],b=shapes[(si+1)%4],bb=si===4?shapes[0]:b,aa=si===4?shapes[0]:a;
 const r=aa.map((v,i)=>L(v,bb[i],si>=4?0:f));
 const rot=(si+f*(si<4?1:0))*1.5708+Math.sin(t*1.4)*.04,pulse=1+.04*Math.sin(t*9)*(1-S(5.2,5.8,t)),sc=pulse*(1+.12*sp(S(5.3,6.4,t),1.4,5));
 const d=path(r,rot,sc);$('out').setAttribute('d',d);$('cpp').setAttribute('d',d);$('ghost').setAttribute('d',path(r,rot,sc*1.14));
 // 100 %: el menisco se agita y asienta, un anillo se expande y se traza el check; luego el líquido se vacía y el loop reinicia
 const drain=dr(S(6.45,7.2,t)),p=prog(t)*(1-drain),lvl=L(R*1.7,-R*1.7,p/100)*sc;
 const slosh=t<5.3?16:t<6.45?16*Math.exp(-(t-5.3)*3.2)*Math.abs(Math.cos((t-5.3)*7)):16*S(6.45,6.9,t);
 const wave=(amp,ph,y)=>{let s=`M-400 ${y}`;for(let x=-400;x<=400;x+=20)s+=`L${x} ${(y+Math.sin(x*.016+ph)*amp).toFixed(1)}`;return s+'L400 400L-400 400Z'};
 $('w1').setAttribute('d',wave(slosh,t*4,lvl));$('w2').setAttribute('d',wave(slosh*.8,t*3+2,lvl-14));
 const rp=S(5.35,6.3,t);$('rp').setAttribute('r',R*sc*(1.1+dr(rp)*.7));$('rp').setAttribute('opacity',rp>0&&rp<1?(1-rp)*.9:0);
 $('ck').setAttribute('stroke-dashoffset',1-bez(.5,0,.1,1)(S(5.5,6.2,t))*(1-S(6.45,6.7,t)));
 $('n').textContent=String(Math.round(p)).padStart(3,'0');
},{still:6400});
</script></body></html>
