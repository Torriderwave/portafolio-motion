<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../_brand/fonts/fonts.css"><title>Morph — loader editorial con cifra que invierte color</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8e3d8}svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#film{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.16;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 55%,rgba(60,40,20,.22))}
text{font:300 380px/1 Display,serif;text-anchor:middle;letter-spacing:-6px;font-variant-numeric:lining-nums tabular-nums}</style></head>
<body>
<svg id="s" viewBox="0 0 1600 900" role="img" aria-label="Un indicador de carga: una forma cambia de silueta mientras se llena y la cifra invierte su color dentro del líquido">
<defs>
<clipPath id="cp"><path id="cpp"/></clipPath><clipPath id="cpo"><path id="cpoo"/></clipPath><clipPath id="cw"><path id="cww"/></clipPath>
<linearGradient id="lq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e86a35"/><stop offset=".6" stop-color="#c8431a"/><stop offset="1" stop-color="#7d230c"/></linearGradient>
<radialGradient id="sd"><stop offset="0" stop-color="#3a2410" stop-opacity=".32"/><stop offset="1" stop-color="#3a2410" stop-opacity="0"/></radialGradient>
</defs>
<g id="cam" style="transform-origin:800px 450px">
<ellipse cx="800" cy="800" rx="360" ry="34" fill="url(#sd)"/>
<g transform="translate(800 440)">
 <path id="ghost" fill="none" stroke="#1a1612" stroke-opacity=".16" stroke-width="1.5"/>
 <g clip-path="url(#cp)"><rect x="-380" y="-380" width="760" height="760" fill="#e8e3d8"/><path id="w2" fill="#e0ae8c" opacity=".55"/><path id="w1" fill="url(#lq)"/></g>
 <path id="out" fill="none" stroke="#1a1612" stroke-width="2.5" stroke-linejoin="round"/>
 <circle id="rp" r="0" fill="none" stroke="#c8431a" stroke-width="2" opacity="0"/>
</g>
<text id="t1" x="800" y="582" fill="#1a1612">0</text>
<g clip-path="url(#cpo)"><g clip-path="url(#cw)" id="gw"><text id="t2" x="800" y="582" fill="#f3ece0">0</text></g></g>
</g></svg>
<div class="vg"></div><div id="film"></div>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
/* acabado: grano de película (24 fps), viñeta, micro-shake de impacto */
let _g;const grain=(x,w,h,t,a=.09)=>{if(!_g){_g=document.createElement('canvas');_g.width=_g.height=180;const g=_g.getContext('2d'),d=g.createImageData(180,180),r=rng(9);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=r()*255|0;d.data[i+3]=255}g.putImageData(d,0,0)}
 const r=rng(Math.floor(t*24)+1),ox=r()*180|0,oy=r()*180|0;x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';x.translate(-ox,-oy);x.fillStyle=x.createPattern(_g,'repeat');x.fillRect(ox,oy,w,h);x.restore()};
const vig=(x,w,h,a=.5)=>{const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,w,h)};
const film=t=>{const e=document.getElementById('film');if(e){const r=rng(Math.floor(t*24)+3);e.style.backgroundPosition=`${r()*220|0}px ${r()*220|0}px`}};
const shake=(t,t0,a=6,d=.3)=>{const k=S(t0,t0+d,t);if(k<=0||k>=1)return[0,0];const e=(1-k)*(1-k)*a;return[Math.sin(k*67)*e,Math.cos(k*59)*e]};
const FONTS=()=>document.fonts?Promise.all(['300 40px Display','italic 300 40px Display','500 20px Sans'].map(f=>document.fonts.load(f,'AÁaáÍí0'))):Promise.resolve();
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;
FONTS().then(()=>{window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)})}
const $=id=>document.getElementById(id),M=120,A=Array.from({length:M},(_,i)=>i/M*6.2832);
// el clip de la cifra clara va en coordenadas de pantalla: la forma está trasladada a (800,440)
const polar=f=>A.map(a=>f(a));
const tri=a=>{const k=((a+1.5708)%2.0944+2.0944)%2.0944-1.0472;return .5/Math.cos(k)};
const shapes=[polar(a=>1),polar(a=>{const c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));return .86/Math.pow(Math.pow(c,5)+Math.pow(s,5),.2)}),polar(a=>tri(a)*1.5),polar(a=>1.02-.3*Math.pow(Math.abs(Math.sin(2*a)),1.7))];
const R=262,ease=bez(.75,0,.12,1),eO=bez(.16,.84,.2,1);
const path=(r,rot,sc,ox=0,oy=0)=>'M'+r.map((v,i)=>{const a=A[i]+rot;return(Math.cos(a)*v*R*sc+ox).toFixed(1)+' '+(Math.sin(a)*v*R*sc+oy).toFixed(1)}).join('L')+'Z';
const prog=t=>{const k=[[0,0],[.5,0],[1.3,23],[1.8,23],[2.7,61],[3.1,61],[4.1,87],[4.6,87],[5.3,100],[8,100]];for(let i=1;i<k.length;i++)if(t<=k[i][0])return L(k[i-1][1],k[i][1],bez(.4,0,.2,1)(S(k[i-1][0],k[i][0],t)));return 100};
const dr=bez(.6,0,.2,1);
play(7300,t=>{t/=1000;
 const si=Math.min(4,Math.floor(t/.9)),f=ease(S(si*.9+.05,si*.9+.85,t)),a=shapes[si%4],b=shapes[(si+1)%4],bb=si===4?shapes[0]:b,aa=si===4?shapes[0]:a;
 const r=aa.map((v,i)=>L(v,bb[i],si>=4?0:f));
 // impacto al llegar al 100 %: golpe de escala + micro-shake + anillo
 const hit=sp(S(5.3,6.4,t),1.4,5),sc=1+.1*hit-(.1*S(6.45,6.9,t)),rot=(si+f*(si<4?1:0))*1.5708*.5+Math.sin(t*1.4)*.03;
 const sh=shake(t,5.3,5,.35);$('cam').style.transform=`translate(${sh[0]}px,${sh[1]}px)`;
 const d=path(r,rot,sc);$('out').setAttribute('d',d);$('cpp').setAttribute('d',d);$('cpoo').setAttribute('d',path(r,rot,sc,800,440));$('ghost').setAttribute('d',path(r,rot,sc*1.1));
 const drain=dr(S(6.45,7.2,t)),p=prog(t)*(1-drain),lvl=L(R*1.7,-R*1.7,p/100)*sc;
 const slosh=t<5.3?15:t<6.45?15*Math.exp(-(t-5.3)*3.2)*Math.abs(Math.cos((t-5.3)*7)):15*S(6.45,6.9,t);
 const wave=(amp,ph,y,ox,oy)=>{let s=`M${-420+ox} ${y+oy}`;for(let x=-420;x<=420;x+=20)s+=`L${x+ox} ${(y+oy+Math.sin(x*.016+ph)*amp).toFixed(1)}`;return s+`L${420+ox} ${460+oy}L${-420+ox} ${460+oy}Z`};
 $('w1').setAttribute('d',wave(slosh,t*4,lvl,0,0));$('w2').setAttribute('d',wave(slosh*.8,t*3+2,lvl-16,0,0));
 $('cww').setAttribute('d',wave(slosh,t*4,lvl,800,440));
 const n=String(Math.round(p));$('t1').textContent=n;$('t2').textContent=n;
 const rp=S(5.35,6.4,t);$('rp').setAttribute('r',R*sc*(1.05+eO(rp)*.7));$('rp').setAttribute('opacity',rp>0&&rp<1?(1-rp)*.8:0);
 film(t)},{hold:0,still:6300});
</script></body></html>
