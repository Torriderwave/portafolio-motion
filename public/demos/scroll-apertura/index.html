<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../_brand/fonts/fonts.css"><title>Abrir — hero editorial guiado por scroll (CSS scroll-timeline)</title>
<style>
:root{--ink:#0b0b0c;--bone:#ece6da;--e1:cubic-bezier(.76,0,.18,1);--e2:cubic-bezier(.16,.84,.2,1)}
*{box-sizing:border-box}
html{background:var(--ink)}body{margin:0;height:520vh}
.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#17171a,#0b0b0c 70%);color:var(--bone)}
.stage>*{position:absolute}
.word{inset:0;display:flex;align-items:center;justify-content:center;font:300 38vmin/1 Display,serif;letter-spacing:-.03em}
.word i{display:block;overflow:hidden;padding:0 .02em;font-style:normal}
.word b{display:block;font-weight:inherit;translate:0 0}
.iris{inset:0;clip-path:circle(150% at 50% 50%);background:radial-gradient(90% 80% at 50% 108%,#f3c79b 0%,#d4561f 34%,#5a1d0a 70%,#1b0904 100%);display:grid;place-items:center;color:var(--bone)}
.iris .in{display:flex;font:italic 300 24vmin/1.05 Display,serif;letter-spacing:-.02em;overflow:hidden;padding:0 3vmin 3vmin}
.iris .in b{display:block;font-weight:inherit;translate:0 0}
.ring{position:absolute;left:50%;top:50%;width:92vmin;height:92vmin;margin:-46vmin 0 0 -46vmin;border:1px solid rgba(236,230,218,.35);border-radius:50%}
.ring.r2{width:130vmin;height:130vmin;margin:-65vmin 0 0 -65vmin;border-color:rgba(236,230,218,.18)}
.lab{left:5vmin;bottom:4.6vmin;font:500 max(10px,1.5vmin)/1 Sans,sans-serif;letter-spacing:.32em;text-transform:uppercase;opacity:.7}
.bar{left:5vmin;right:5vmin;bottom:3.2vmin;height:1px;background:rgba(236,230,218,.25)}.bar i{display:block;height:100%;background:var(--bone);transform-origin:0 50%;scale:1 1}
.vig{inset:0;background:radial-gradient(120% 100% at 50% 50%,transparent 50%,rgba(0,0,0,.55));pointer-events:none}
#film{position:fixed;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.2;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
@supports (animation-timeline:scroll()){
 .stage *{animation-fill-mode:both}
 .word b{animation:win var(--e2) both,wout var(--e1) both;animation-timeline:scroll(root),scroll(root);animation-range:calc(var(--n)*1.6%) calc(16% + var(--n)*1.6%),26% 54%}
 @keyframes win{from{translate:0 105%}}
 @keyframes wout{to{translate:calc((var(--n) - 2)*26vmin) calc((var(--n) - 2)*-3vmin);scale:1.4;opacity:0;filter:blur(2vmin)}}
 .iris{animation:ir var(--e1) both;animation-timeline:scroll(root);animation-range:28% 70%}
 @keyframes ir{from{clip-path:circle(0% at 50% 50%)}}
 .iris .in b{animation:up var(--e2) both;animation-timeline:scroll(root);animation-range:calc(52% + var(--n)*2.4%) calc(76% + var(--n)*2.4%)}
 @keyframes up{from{translate:0 110%}}
 .ring{animation:rg linear both;animation-timeline:scroll(root);animation-range:0% 100%}
 @keyframes rg{from{scale:.35;opacity:0}25%{opacity:1}to{scale:1.1;rotate:30deg}}
 .lab{animation:lb linear both;animation-timeline:scroll(root);animation-range:0% 14%}
 @keyframes lb{to{opacity:0;translate:0 1vmin}}
 .bar i{animation:pr linear both;animation-timeline:scroll(root)}
 @keyframes pr{from{scale:0 1}}
}
@media (prefers-reduced-motion:reduce){.stage *{animation:none!important}.word{opacity:0}.lab{opacity:0}.ring{opacity:.6}}
</style></head>
<body>
<div class="stage" aria-hidden="true">
 <div class="word"><i><b style="--n:0">A</b></i><i><b style="--n:1">b</b></i><i><b style="--n:2">r</b></i><i><b style="--n:3">i</b></i><i><b style="--n:4">r</b></i></div>
 <div class="iris"><i class="ring"></i><i class="ring r2"></i><div class="in"><b style="--n:0">a</b><b style="--n:1">d</b><b style="--n:2">e</b><b style="--n:3">n</b><b style="--n:4">t</b><b style="--n:5">r</b><b style="--n:6">o</b></div></div>
 <div class="lab">Desplaza</div><div class="bar"><i></i></div><div class="vig"></div>
</div><div id="film"></div>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
/* acabado: grano de película (24 fps), viñeta, micro-shake de impacto */
let _g;const grain=(x,w,h,t,a=.09)=>{if(!_g){_g=document.createElement('canvas');_g.width=_g.height=180;const g=_g.getContext('2d'),d=g.createImageData(180,180),r=rng(9);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=r()*255|0;d.data[i+3]=255}g.putImageData(d,0,0)}
 const r=rng(Math.floor(t*24)+1),ox=r()*180|0,oy=r()*180|0;x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';x.translate(-ox,-oy);x.fillStyle=x.createPattern(_g,'repeat');x.fillRect(ox,oy,w,h);x.restore()};
const vig=(x,w,h,a=.5)=>{const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,w,h)};
const film=t=>{const e=document.getElementById('film');if(e){const r=rng(Math.floor(t*24)+3);e.style.backgroundPosition=`${r()*220|0}px ${r()*220|0}px`}};
const shake=(t,t0,a=6,d=.3)=>{const k=S(t0,t0+d,t);if(k<=0||k>=1)return[0,0];const e=(1-k)*(1-k)*a;return[Math.sin(k*67)*e,Math.cos(k*59)*e]};
const FONTS=()=>document.fonts?Promise.all(['300 40px Display','italic 300 40px Display','500 20px Sans'].map(f=>document.fonts.load(f,'AÁaáÍí0'))):Promise.resolve();
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;
FONTS().then(()=>{window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)})}
const root=document.scrollingElement,mx=()=>root.scrollHeight-innerHeight,ease=bez(.4,0,.6,1);
const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
window.__D=8000;
window.__seek=t=>{root.scrollTop=mx()*ease(Math.min(1,t/8000));film(t/1000);return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))};
if(!cap)(function g(n){film(n/1000);if(!rm)requestAnimationFrame(g)})(0);
if(!cap&&!rm&&CSS.supports('animation-timeline','scroll()')){
 let go=true,t0=performance.now();['wheel','touchstart','keydown','pointerdown'].forEach(e=>addEventListener(e,()=>go=false,{passive:true,once:true}));
 const rw=bez(.7,0,.2,1);
 const f=n=>{if(!go)return;const t=(n-t0)%11400;const p=t<8000?ease(t/8000):t<9400?1:t<11000?1-rw((t-9400)/1600):0;root.scrollTop=mx()*p;requestAnimationFrame(f)};requestAnimationFrame(f);
}
</script></body></html>
