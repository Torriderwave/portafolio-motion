const shake=(t,t0,a=6,d=.3)=>{const k=S(t0,t0+d,t);if(k<=0||k>=1)return[0,0];const e=(1-k)*(1-k)*a;return[Math.sin(k*67)*e,Math.cos(k*59)*e]};

const cv=document.getElementById('c'),LG=new Image(),IC=new Image();LG.src='../_brand/gustello-cream.webp';IC.src='../_brand/gustello-iso-cream.webp';

 const m=eO(S(7.4,8.2,t));x.save();x.globalAlpha=m;x.translate(w-150,h-150+(1-m)*40);x.fillStyle=CA;rr(x,-90,-100,180,200,22);x.fill();x.strokeStyle=OR;x.lineWidth=3;rr(x,-76,-86,152,172,14);x.stroke();if(IC.complete){x.drawImage(IC,-34,-64,68,62)}x.fillStyle=CR;x.font='700 15px Jakarta,sans-serif';x.textAlign='center';x.fillText('Menú',0,40);x.font='500 11px Jakarta,sans-serif';x.fillStyle=BE;x.fillText('Salón · Terraza',0,62);x.restore()}
