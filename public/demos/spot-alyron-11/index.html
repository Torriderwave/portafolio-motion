<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alyron — spot 1:1 (8 s, concepto)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a1424}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c" role="img" aria-label="Spot de Alyron: del caos, sistema. Puntos dispersos se ordenan en una retícula y forman un triángulo."></canvas>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)}
const cv=document.getElementById('c'),FN='ui-sans-serif,system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif';
const GO='#cba052',GL='#f1deac',NV='#0a1424',eO=bez(.16,.84,.2,1),eI=bez(.7,0,.15,1);
const G=15,SP=56,OX=540-SP*7,OY=470-SP*7,rd=rng(21);
const ps=[];for(let j=0;j<G;j++)for(let i=0;i<G;i++){const gx=OX+i*SP,gy=OY+j*SP,d=Math.hypot(gx-540,gy-470)/(SP*10);ps.push({i,j,gx,gy,d,bx:rd()*1080,by:rd()*1080,p1:rd()*6.28,p2:rd()*6.28,s:.5+rd()*.9,tri:Math.abs(gx-540)<=(gy-190)*.5+2&&gy<=806&&gy>=190})}
const chaos=(o,t)=>[o.bx+Math.sin(t*o.s*1.3+o.p1)*90+Math.sin(t*3.1+o.p2)*14,o.by+Math.cos(t*o.s*1.1+o.p2)*90+Math.cos(t*2.7+o.p1)*14];
const pos=(o,t)=>{const e=sp(S(2.2+o.d*.9,3.4+o.d*.9,t),1.05,5.5),c=chaos(o,Math.min(t,3.4));return[L(c[0],o.gx,e),L(c[1],o.gy,e)]};
const LET=[['M4 94L34 6L64 94',0],['M8 6V94H48',96],['M4 6L30 54L56 6M30 54V94',174],['M8 94V6H38A22 22 0 0 1 38 50H8M32 50L56 94',262],['c',350],['M8 94V6L56 94V6',466]].map(([d,x])=>({d:d==='c'?'M44 10A40 40 0 1 1 43.9 10Z':d,x,l:d==='c'?250:d.length*5.2}));
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');LET.forEach(o=>{const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',o.d);svg.appendChild(p);o.l=p.getTotalLength();o.P=new Path2D(o.d)});
function label(x,s,a,al){x.globalAlpha=al*.7;x.fillStyle=GO;x.font=`600 30px ${FN}`;x.textAlign='center';if('letterSpacing'in x)x.letterSpacing=(L(14,10,a))+'px';x.fillText(s,540+5,1000);if('letterSpacing'in x)x.letterSpacing='0px';x.globalAlpha=1}
play(8000,t=>{t/=1000;const[x,w,h]=fit(cv),k=Math.min(w,h)/1080;
 x.fillStyle=NV;x.fillRect(0,0,w,h);x.save();x.translate((w-1080*k)/2,(h-1080*k)/2);x.scale(k,k);
 const gl=x.createRadialGradient(540,470,0,540,470,620);gl.addColorStop(0,'rgba(203,160,82,.2)');gl.addColorStop(1,'rgba(203,160,82,0)');x.globalAlpha=eO(S(3.4,5.2,t));x.fillStyle=gl;x.fillRect(0,0,1080,1080);x.globalAlpha=1;
 const P=ps.map(o=>pos(o,t));
 // estelas durante el caos
 const tr=1-S(2.2,3.2,t);if(tr>0){x.strokeStyle=GO;x.lineWidth=2;ps.forEach((o,n)=>{x.globalAlpha=.3*tr;const q=pos(o,Math.max(0,t-.08));x.beginPath();x.moveTo(q[0],q[1]);x.lineTo(P[n][0],P[n][1]);x.stroke()});x.globalAlpha=1}
 // retícula que se dibuja
 const lp=eO(S(4.0,5.4,t));if(lp>0){x.strokeStyle='rgba(203,160,82,.26)';x.lineWidth=1.5;x.beginPath();ps.forEach((o,n)=>{const a=P[n],dl=S(0,1,lp*1.4-o.d*.9);if(dl<=0)return;if(o.i<G-1){const b=P[n+1];x.moveTo(a[0],a[1]);x.lineTo(L(a[0],b[0],dl),L(a[1],b[1],dl))}if(o.j<G-1){const b=P[n+G];x.moveTo(a[0],a[1]);x.lineTo(L(a[0],b[0],dl),L(a[1],b[1],dl))}});x.stroke()}
 // puntos: onda de brillo, y al final solo el triángulo se queda encendido
 const wv=S(3.6,5.4,t)*1.4,tri=eO(S(5.3,6.3,t));
 ps.forEach((o,n)=>{const br=Math.exp(-Math.pow((o.d-wv)*6,2)),inT=o.tri?tri:0,dim=1-.72*tri*(o.tri?0:1);
  const r=L(L(4,6,S(2.2,3.4,t)),(o.tri?11:4.2),inT)+br*5;x.globalAlpha=dim;x.fillStyle=br>.35||inT>.5?(inT>.5?GL:GL):GO;x.beginPath();x.arc(P[n][0],P[n][1],r,0,6.283);x.fill()});x.globalAlpha=1;
 label(x,'CAOS',0,S(.3,.9,t)*(1-S(2.3,2.9,t)));label(x,'SISTEMA',1,S(3.6,4.3,t)*(1-S(5.7,6.2,t)));
 // logotipo
 x.save();x.translate(344,925);x.scale(.74,.74);x.lineWidth=11;x.strokeStyle=GO;x.lineJoin='miter';
 LET.forEach((o,i)=>{const p=eO(S(6.0+i*.1,7.0+i*.1,t));if(p<=0)return;x.save();x.translate(o.x,0);x.setLineDash([o.l,o.l]);x.lineDashOffset=o.l*(1-p);x.stroke(o.P);x.restore()});x.restore();
 x.restore()},{hold:1500});
</script></body></html>
