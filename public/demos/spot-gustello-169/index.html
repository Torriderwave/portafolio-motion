<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../_brand/fonts/fonts.css"><title>Gustello — spot 16:9 (12 s, concepto)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#100c09}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c" role="img" aria-label="Spot de Gustello: Pedido. Cocina. Mesa. Logotipo: Tu mesa, a tu ritmo."></canvas>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
/* acabado: grano de película (24 fps), viñeta, micro-shake de impacto */
let _g;const grain=(x,w,h,t,a=.09)=>{if(!_g){_g=document.createElement('canvas');_g.width=_g.height=180;const g=_g.getContext('2d'),d=g.createImageData(180,180),r=rng(9);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=r()*255|0;d.data[i+3]=255}g.putImageData(d,0,0)}
 const r=rng(Math.floor(t*24)+1),ox=r()*180|0,oy=r()*180|0;x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';x.translate(-ox,-oy);x.fillStyle=x.createPattern(_g,'repeat');x.fillRect(ox,oy,w,h);x.restore()};
const vig=(x,w,h,a=.5)=>{const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,w,h)};
const film=t=>{const e=document.getElementById('film');if(e){const r=rng(Math.floor(t*24)+3);e.style.backgroundPosition=`${r()*220|0}px ${r()*220|0}px`}};
const shake=(t,t0,a=6,d=.3)=>{const k=S(t0,t0+d,t);if(k<=0||k>=1)return[0,0];const e=(1-k)*(1-k)*a;return[Math.sin(k*67)*e,Math.cos(k*59)*e]};
const FONTS=()=>document.fonts?Promise.all(['300 40px Display','italic 300 40px Display','500 20px Sans'].map(f=>document.fonts.load(f,'AÁaáÍí0'))):Promise.resolve();
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;
FONTS().then(()=>{window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)})}
const cv=document.getElementById('c'),GL=new Image();GL.src='../_brand/gustello-cream.webp';
const INK='#100c09',EM='#d9560a',CR='#f2e7d5',BEAT=.6;
const eO=bez(.16,.84,.2,1),eI=bez(.76,0,.18,1);
// palabra con máscara de línea: cada letra sube desde debajo de su caja en el pulso
function word(x,str,cx,by,size,t,t0,col,{it=false,st=.07,ls=-8,bump=0}={}){x.font=`${it?'italic ':''}300 ${size}px Display,serif`;if('letterSpacing'in x)x.letterSpacing=ls+'px';x.textBaseline='alphabetic';
 const ws=[...str].map(c=>x.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0);let px=cx-tot/2;
 [...str].forEach((c,i)=>{const k=eO(S(t0+i*st,t0+i*st+.55,t));if(k>0){x.save();x.translate(px+ws[i]/2,by);x.beginPath();x.rect(-ws[i],-size*.92,ws[i]*2,size*1.2);x.clip();
   const b=bump?Math.exp(-9*((t-t0)%BEAT))*bump:0;x.translate(0,(1-k)*size*1.05);x.scale(1+b*.4,1-b);x.fillStyle=col;x.textAlign='center';x.fillText(c,0,0);x.restore()}px+=ws[i]});
 if('letterSpacing'in x)x.letterSpacing='0px';return tot}
function s1(x,t){x.fillStyle=INK;x.fillRect(0,0,1920,1080);
 // cinta de ticket que sube despacio (textura, no protagonista)
 x.save();x.globalAlpha=.07;x.fillStyle=CR;for(let i=0;i<46;i++){const y=((i*52-t*90)%1100+1100)%1100-20;x.fillRect(1280,y,300-((i*53)%7)*30,8)}x.fillRect(1250,0,2,1080);x.fillRect(1610,0,2,1080);x.restore();
 const wd=word(x,'Pedido.',860,690,430,t,.15,CR,{st:.08});
 const u=eI(S(1.1,1.9,t));x.fillStyle=EM;x.fillRect(860-wd/2+6,730,(wd-12)*u,5)}
function s2(x,t){x.fillStyle=EM;x.fillRect(0,0,1920,1080);
 const lg=x.createRadialGradient(960,1080,0,960,1080,1000);lg.addColorStop(0,'rgba(255,196,120,.55)');lg.addColorStop(1,'rgba(255,196,120,0)');x.fillStyle=lg;x.fillRect(0,0,1920,1080);
 x.strokeStyle='rgba(16,12,9,.28)';x.lineWidth=3;x.lineCap='round';
 for(let i=0;i<7;i++){const bx=420+i*180,k=eO(S(.1+i*.07,1.4+i*.07,t));if(k<=0)continue;x.globalAlpha=Math.sin(Math.PI*Math.min(1,k))*.9;x.beginPath();for(let y=0;y<=16;y++){const yy=1060-y*58*k,xx=bx+Math.sin(y*.5+t*2.4+i)*(14+y*2.5);y?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke()}x.globalAlpha=1;
 word(x,'Cocina.',960,700,450,t,.1,INK,{it:true,st:.07,bump:.045})}
function s3(x,t){x.fillStyle=CR;x.fillRect(0,0,1920,1080);
 word(x,'Mesa.',620,560,430,t,.1,INK,{st:.09});
 // plato en línea fina que gira hacia su sitio; la cloche cae sobre el pulso y queda en ámbar
 const pk=eO(S(.2,1.2,t)),cx=1400,cy=760;x.save();x.translate(cx,cy+(1-pk)*420);x.scale(1,.34);x.strokeStyle=INK;x.lineWidth=3;for(let i=0;i<4;i++){x.globalAlpha=.9-i*.2;x.beginPath();x.arc(0,0,330-i*46,0,6.283);x.stroke()}x.restore();x.globalAlpha=1;
 const d=sp(S(1.05,1.9,t),1.3,5.5),dy=(1-d)*-760;if(S(1.05,1.9,t)>0){x.save();x.translate(cx,cy-96+dy);const sq=1+.09*Math.max(0,Math.sin(Math.PI*S(1.78,2.0,t)));x.scale(1/sq,sq);x.fillStyle=EM;x.beginPath();x.moveTo(-200,0);x.bezierCurveTo(-200,-170,-100,-240,0,-240);x.bezierCurveTo(100,-240,200,-170,200,0);x.closePath();x.fill();x.fillRect(-232,0,464,12);x.beginPath();x.arc(0,-262,18,0,6.283);x.fill();x.fillStyle='rgba(255,255,255,.28)';x.beginPath();x.ellipse(-92,-130,14,70,.4,0,6.283);x.fill();x.restore()}}
let OFF=null;
function s4(x,t){x.fillStyle=INK;x.fillRect(0,0,1920,1080);
 const gl=x.createRadialGradient(960,540,0,960,540,820);gl.addColorStop(0,'rgba(217,86,10,.28)');gl.addColorStop(1,'rgba(217,86,10,0)');x.fillStyle=gl;x.fillRect(0,0,1920,1080);
 const a=eO(S(.45,1.5,t));if(a>0&&GL.complete){
  const W=1180,H=W*GL.naturalHeight/GL.naturalWidth;
  if(!OFF){OFF=document.createElement('canvas');OFF.width=W*2;OFF.height=Math.round(H*2)}
  const o=OFF.getContext('2d');o.clearRect(0,0,OFF.width,OFF.height);o.globalCompositeOperation='source-over';o.drawImage(GL,0,0,OFF.width,OFF.height);
  // destello que recorre el lockup completo (solo sobre las letras: source-atop)
  const p=S(.9,2.4,t),px=L(-400,OFF.width+400,eIO2(p));o.globalCompositeOperation='source-atop';const sg=o.createLinearGradient(px-260,0,px+260,0);sg.addColorStop(0,'rgba(255,214,170,0)');sg.addColorStop(.5,'rgba(255,238,210,'+(.95*Math.sin(Math.PI*p))+')');sg.addColorStop(1,'rgba(255,214,170,0)');o.fillStyle=sg;o.fillRect(0,0,OFF.width,OFF.height);
  const z=L(1.06,1,eO(S(.45,2.4,t)))*(1+.03*S(2,4.8,t));x.save();x.translate(960,540);x.scale(z,z);x.globalAlpha=a;
  // aparece completo: luz que se enfoca (halo) y asienta
  x.shadowColor='rgba(255,170,90,'+(.5*(1-S(.5,2.2,t)))+')';x.shadowBlur=60*(1-S(.5,2.2,t));x.drawImage(OFF,-W/2,-H/2,W,H);x.restore()}}
const eIO2=bez(.5,0,.2,1);
const SC=[s1,s2,s3,s4],T=[0,2.4,4.8,7.2];
play(12000,t=>{t/=1000;const[x,w,h]=fit(cv),k=Math.min(w/1920,h/1080);
 let i=0;while(i<3&&t>=T[i+1])i++;
 x.save();x.translate((w-1920*k)/2,(h-1080*k)/2);x.scale(k,k);x.beginPath();x.rect(0,0,1920,1080);x.clip();
 const sh=shake(t,T[i],i?9:0,.28);x.translate(sh[0],sh[1]);
 SC[i](x,t-T[i]);
 // golpe de corte: destello de 3 fotogramas sobre el pulso
 if(i>0){const f=1-S(0,.12,t-T[i]);if(f>0){x.fillStyle=`rgba(255,244,226,${f*.55})`;x.fillRect(-20,-20,1960,1120)}}
 x.restore();vig(x,w,h,.5);grain(x,w,h,t,.1)},{hold:1200});
</script></body></html>
