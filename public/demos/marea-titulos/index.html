<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a1a38}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c" role="img" aria-label="Marea: al atardecer el agua sube y revela las palabras Luz, Sal y Marea"></canvas>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
/* acabado: grano de película (24 fps), viñeta, micro-shake de impacto */
let _g;const grain=(x,w,h,t,a=.09)=>{if(!_g){_g=document.createElement('canvas');_g.width=_g.height=180;const g=_g.getContext('2d'),d=g.createImageData(180,180),r=rng(9);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=r()*255|0;d.data[i+3]=255}g.putImageData(d,0,0)}
 const r=rng(Math.floor(t*24)+1),ox=r()*180|0,oy=r()*180|0;x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';x.translate(-ox,-oy);x.fillStyle=x.createPattern(_g,'repeat');x.fillRect(ox,oy,w,h);x.restore()};
const vig=(x,w,h,a=.5)=>{const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,w,h)};
const film=t=>{const e=document.getElementById('film');if(e){const r=rng(Math.floor(t*24)+3);e.style.backgroundPosition=`${r()*220|0}px ${r()*220|0}px`}};
const shake=(t,t0,a=6,d=.3)=>{const k=S(t0,t0+d,t);if(k<=0||k>=1)return[0,0];const e=(1-k)*(1-k)*a;return[Math.sin(k*67)*e,Math.cos(k*59)*e]};
const FONTS=()=>document.fonts?Promise.all(['300 40px Display','italic 300 40px Display','500 20px Sans'].map(f=>document.fonts.load(f,'AÁaáÍí0'))):Promise.resolve();

window.__D=D;
FONTS().then(()=>{window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)})}
const cv=document.getElementById('c'),CR='#f6ecda',CO='#ff6b4a',MAXW=820;
const eO=bez(.16,.84,.2,1);
const WORDS=[['Luz',.5,2.5],['Sal',2.6,4.5],['Marea',4.6,6.6]];
const level=t=>{let l=t<2.6?L(1.1,.43,eO(S(0,1.9,t))):t<4.6?L(.43,.38,eO(S(2.6,3.4,t))):t<6.6?L(.38,.33,eO(S(4.6,5.4,t))):L(.33,.40,eO(S(6.6,7.4,t)));WORDS.forEach(([,a])=>{if(t>=a)l+=.04*Math.exp(-5*(t-a))*Math.cos(14*(t-a))});return l};
const surf=(X,Y,t,A=1)=>Y+(Math.sin(X*.008+t*1.5+.3)*40+Math.sin(X*.0184-t*1.05+.6)*14)*A;
function wavePath(x,fn,X0,X1,bottom){x.beginPath();x.moveTo(X0,bottom);for(let X=X0;X<=X1;X+=20)x.lineTo(X,fn(X));x.lineTo(X1,bottom);x.closePath()}
const TC=document.createElement('canvas'),TD=document.createElement('canvas'),SC=1.5;TC.width=TD.width=1080*SC;TC.height=TD.height=720*SC;
const rd=rng(17),spark=Array.from({length:150},()=>({u:rd(),v:rd(),s:.5+rd()*1.6,p:rd()*6.28,f:1+rd()*3}));

play(8000,t=>{t/=1000;const[x,w,h]=fit(cv),k=Math.min(w/1080,h/1920),X0=-(w/k)/2+540-300,X1=(w/k)/2+540+300,YT=-(h/k)/2+960-300,YB=(h/k)/2+960+300;
 const sk=[0,0];let pulse=0;WORDS.forEach(([,a])=>{const s=shake(t,a,12,.34);sk[0]+=s[0];sk[1]+=s[1];if(t>=a)pulse+=Math.exp(-6*(t-a))});
 x.fillStyle='#0a1a38';x.fillRect(0,0,w,h);x.save();x.translate((w-1080*k)/2+sk[0],(h-1920*k)/2+sk[1]);x.scale(k,k);

 for(let i=0;i<60;i++){const sx=X0+((i*97)%1000)/1000*(X1-X0),sy=YT+((i*53)%1000)/1000*(Y*.55-YT),a=(.2+.6*Math.abs(Math.sin(t*1.3+i)))*(1-S(.3,.62,(sy-YT)/(Y-YT)));x.fillStyle=`rgba(255,244,226,${a*.7})`;x.fillRect(sx,sy,2,2)}
 // sol con halo; pulsa en cada corte
 const hg=x.createRadialGradient(SX,SY,0,SX,SY,900);hg.addColorStop(0,`rgba(255,214,150,${.6+.25*pulse})`);hg.addColorStop(.25,'rgba(255,150,110,.28)');hg.addColorStop(1,'rgba(255,150,110,0)');x.fillStyle=hg;x.fillRect(X0,YT,X1-X0,YB-YT);
 const sg=x.createRadialGradient(SX,SY,0,SX,SY,150*(1+.08*pulse));sg.addColorStop(0,'#fffbe8');sg.addColorStop(.7,'#ffe3a8');sg.addColorStop(1,'#ffc77a');x.fillStyle=sg;x.beginPath();x.arc(SX,SY,150*(1+.08*pulse),0,6.283);x.fill();
 // olas lejanas con bruma atmosférica
 [['#e29a78','#c27a74',150,.5,.0045,0],['#9b6b86','#6d5683',95,.0,.0063,1.2]].forEach(([c1,c2,off,ph,fr,sd],i)=>{const g=x.createLinearGradient(0,Y-off,0,Y+120);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;wavePath(x,X=>Y-off+Math.sin(X*fr+t*.6+ph)*(30-i*8)+Math.sin(X*fr*2.4-t*.4)*8,X0,X1,YB);x.fill();
  x.strokeStyle='rgba(255,226,170,.45)';x.lineWidth=2;x.beginPath();for(let X=X0;X<=X1;X+=20){const yy=Y-off+Math.sin(X*fr+t*.6+ph)*(30-i*8)+Math.sin(X*fr*2.4-t*.4)*8;X===X0?x.moveTo(X,yy):x.lineTo(X,yy)}x.stroke()});
 // cuerpo de agua frontal con luz rasante
 const sf=X=>surf(X,Y,t);const wg=x.createLinearGradient(0,Y,0,YB);wg.addColorStop(0,'#f0a888');wg.addColorStop(.06,'#4f86a8');wg.addColorStop(.35,'#17587c');wg.addColorStop(1,'#07264a');
 x.fillStyle=wg;wavePath(x,sf,X0,X1,YB);x.fill();
 x.save();wavePath(x,sf,X0,X1,YB);x.clip();
 // camino de reflejo del sol (destellos)
 spark.forEach(s=>{const yy=Y+30+s.v*(YB-Y-30)*.95,wd=60+260*s.v,xx=SX+(s.u-.5)*wd*2,a=Math.max(0,Math.sin(t*s.f*2+s.p))*(1-s.v*.8);x.fillStyle=`rgba(255,236,190,${a*.9})`;x.fillRect(xx-s.s*9,yy,s.s*18,2.2)});
 // cáusticas: filamentos luminosos que derivan
 x.globalCompositeOperation='screen';x.lineWidth=2.2;for(let i=0;i<16;i++){const y0=Y+60+i*((YB-Y)/16),al=.1*(1-i/16);x.strokeStyle=`rgba(150,225,235,${al})`;x.beginPath();for(let X=X0;X<=X1;X+=24){const yy=y0+Math.sin(X*.013+t*1.1+i*1.7)*16+Math.sin(X*.031-t*.8+i)*7;X===X0?x.moveTo(X,yy):x.lineTo(X,yy)}x.stroke()}x.globalCompositeOperation='source-over';
 x.restore();
 // palabra: contorno cálido sobre el agua, relleno refractado bajo la superficie
 const cur=WORDS.find(([,a,b])=>t>=a&&t<b+.15)||(t>=6.6?['marea',6.6,99]:null);
 if(cur){const last=t>=6.6,txt=last?'marea':cur[0],size0=last?380:txt==='Marea'?560:660;let fs=size0;const tcx=TC.getContext('2d');tcx.setTransform(1,0,0,1,0,0);tcx.clearRect(0,0,TC.width,TC.height);tcx.font=`italic 300 ${fs*SC}px Display,serif`;const mw=tcx.measureText(txt).width/SC;if(mw>MAXW)fs*=MAXW/mw;
  const ty=last?1030:1000,sl=.9+.1*S(cur[1],cur[1]+.5,t)*0+.1*Math.max(0,1-(t-cur[1])*6);
  tcx.font=`italic 300 ${fs*SC}px Display,serif`;tcx.textAlign='center';tcx.textBaseline='alphabetic';tcx.fillStyle=CR;tcx.fillText(txt,540*SC,560*SC);
  const OY=ty-560; // desplazamiento del lienzo de texto
  // encima del agua: contorno
  x.save();wavePath(x,X=>sf(X),X0,X1,YT-200);x.clip();x.translate(0,OY);x.font=`italic 300 ${fs}px Display,serif`;x.textAlign='center';x.fillStyle='rgba(22,24,70,.9)';x.fillText(txt,540,560);x.strokeStyle='rgba(255,236,200,.75)';x.lineWidth=2.5;x.strokeText(txt,540,560);x.restore();
  // bajo el agua: rebanadas desplazadas + tinte
  const dcx=TD.getContext('2d');dcx.setTransform(1,0,0,1,0,0);dcx.clearRect(0,0,TD.width,TD.height);
  for(let yy=0;yy<720;yy+=3){const depth=C((yy+OY-Y)/500,0,1.2),dx=(Math.sin(yy*.06+t*3.2)*7+Math.sin(yy*.021-t*2)*9)*(.3+depth*.9);dcx.drawImage(TC,0,yy*SC,TC.width,3*SC,dx*SC,yy*SC,TC.width,3*SC)}
  dcx.globalCompositeOperation='source-atop';const tg=dcx.createLinearGradient(0,0,0,TD.height);tg.addColorStop(0,'rgba(255,230,190,0)');tg.addColorStop(1,'rgba(90,190,210,.42)');dcx.fillStyle=tg;dcx.fillRect(0,0,TD.width,TD.height);dcx.globalCompositeOperation='source-over';
  x.save();wavePath(x,sf,X0,X1,YB);x.clip();x.globalAlpha=.97;x.translate(0,OY);x.scale(sl,sl);x.translate(540*(1-sl)/sl,0);x.drawImage(TD,0,0,1080,720);x.restore();
  // proyección fina del texto sobre la superficie
  }
 // espuma fina y brillo en la línea de agua
 x.strokeStyle='rgba(255,246,228,.9)';x.lineWidth=3;x.beginPath();for(let X=X0;X<=X1;X+=16){const yy=sf(X);X===X0?x.moveTo(X,yy):x.lineTo(X,yy)}x.stroke();
 const fr2=rng(5);for(let i=0;i<150;i++){const X=X0+fr2()*(X1-X0),yy=sf(X)+(fr2()-.4)*14,r=1+fr2()*3.2,a=.35+.5*Math.abs(Math.sin(t*2+i));x.fillStyle=`rgba(255,248,236,${a})`;x.beginPath();x.arc(X+Math.sin(t+i)*4,yy,r,0,6.283);x.fill()}
 // beats: salpicaduras, anillo y destello en cada cambio de palabra
 WORDS.forEach(([,a],wi)=>{const τ=t-a;if(τ>0&&τ<1.6)part[wi].forEach((p,i)=>{const px=540+Math.cos(p.a)*p.v*τ*.9+(i%2?-1:1)*30,py=Y+Math.sin(p.a)*p.v*τ+700*τ*τ,al=1-τ/1.6;x.fillStyle=`rgba(255,246,228,${.85*al})`;x.beginPath();x.arc(px,py,p.r*al+.6,0,6.283);x.fill()});
  const p=S(a,a+.9,t);if(p>0&&p<1){x.strokeStyle='rgba(255,240,210,'+(.7*(1-p))+')';x.lineWidth=4;x.beginPath();x.ellipse(540,Y+10,80+eO(p)*680,14+eO(p)*90,0,0,6.283);x.stroke()}
  const f=t>=a?Math.exp(-13*(t-a)):0;if(f>.01){x.fillStyle=`rgba(255,232,196,${.2*f})`;x.fillRect(X0,YT,X1-X0,YB-YT)}});
 // cierre
 const fin=eO(S(6.9,7.7,t));if(fin>0){x.globalAlpha=fin;x.fillStyle=CO;x.beginPath();x.arc(850,1040,15*sp(S(6.9,7.7,t),1.2,5),0,6.283);x.fill();x.fillStyle=CR;x.fillRect(300,1130,480*fin,2);x.font='500 26px Sans,sans-serif';x.textAlign='center';if('letterSpacing'in x)x.letterSpacing='10px';x.fillText('TEMPORADA 01',545,1200);if('letterSpacing'in x)x.letterSpacing='0px';x.globalAlpha=1}
 x.restore();vig(x,w,h,.45);grain(x,w,h,t,.11)},{hold:1300,still:7700});
