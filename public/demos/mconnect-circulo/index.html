<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MConnect — pantalla de lanzamiento</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#151326}svg{position:absolute;inset:0;width:100%;height:100%;display:block}
text{font:600 36px/1 ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f3eefc;letter-spacing:.34em}</style></head>
<body>
<svg id="s" viewBox="0 0 1600 900" role="img" aria-label="MConnect: tres personas se reúnen en un círculo alrededor de la M">
<defs><radialGradient id="bg" cx=".5" cy=".46" r=".7"><stop offset="0" stop-color="#2a2150"/><stop offset="1" stop-color="#151326"/></radialGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g id="halos" fill="none" stroke="#86e0cf"></g>
<circle id="ring" cx="800" cy="400" r="250" fill="none" stroke="#c6b8ff" stroke-opacity=".5" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 800 400)"/>
<g id="m" transform="translate(800 400) scale(1.35)" fill="none" stroke-width="22" stroke-linecap="round">
 <path id="a1" d="M-98 56 V-4 A49 49 0 0 1 0 -4" stroke="#c6b8ff" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
 <path id="a2" d="M0 -4 A49 49 0 0 1 98 -4 V56" stroke="#f3bea9" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</g>
<circle id="node" cx="800" cy="440" r="0" fill="#86e0cf"/>
<g id="pp"></g>
<text id="wm" x="800" y="786" text-anchor="middle" opacity="0">MConnect</text>
</svg>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)}
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),mk=(p,n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const H=[0,1,2].map(i=>mk($('halos'),'circle',{cx:800,cy:440,r:10,'stroke-width':3,opacity:0}));
const cols=['#c6b8ff','#f3bea9','#ff9db0'],ang=[-150,-30,90];
const P=cols.map((c,i)=>({e:mk($('pp'),'circle',{r:0,fill:c}),a0:ang[i]+200+i*40,a:ang[i],d:2.2+i*.22}));
const eO=bez(.16,.84,.2,1),eI=bez(.65,0,.15,1);
play(6400,t=>{t/=1000;
 // nodo + doble halo
 $('node').setAttribute('r',24*sp(S(.25,1.1,t),1.5,5));
 H.forEach((h,i)=>{const p=S(.7+i*.28,2.1+i*.28,t);h.setAttribute('r',22+p*210);h.setAttribute('opacity',(1-p)*(p>0?.7:0))});
 // arcos que nacen del nodo: M relacional
 $('a1').setAttribute('stroke-dashoffset',1-eO(S(1.1,2.1,t)));$('a2').setAttribute('stroke-dashoffset',1-eO(S(1.3,2.4,t)));
 // el nodo sube al valle de la M con rebote
 $('node').setAttribute('cy',440-38*sp(S(1.9,2.8,t),2,6));
 // tres presencias entran en órbita y se asientan en el círculo
 P.forEach(o=>{const k=S(o.d,o.d+1.5,t),e=eI(k),a=L(o.a0,o.a,sp(S(o.d,o.d+1.5,t),.75,4.5)),r=L(560,250,eO(S(o.d,o.d+1.4,t)));
  const x=800+Math.cos(a*Math.PI/180)*r,y=400+Math.sin(a*Math.PI/180)*r;
  o.e.setAttribute('cx',x);o.e.setAttribute('cy',y);o.e.setAttribute('r',k>0?L(2,19,sp(S(o.d,o.d+1,t),1.2,5)):0)});
 $('ring').setAttribute('stroke-dashoffset',1-eI(S(3.9,5,t)));
 // M late una vez cerrado el círculo
 const pl=1.35+.06*Math.sin(S(4.9,5.6,t)*Math.PI);$('m').setAttribute('transform',`translate(800 400) scale(${pl})`);
 const w=S(4.6,5.8,t);$('wm').setAttribute('opacity',w);$('wm').style.letterSpacing=(.9-.56*eO(w))+'em';
});
</script></body></html>
