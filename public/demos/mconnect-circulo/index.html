<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../_brand/fonts/fonts.css"><title>MConnect — pantalla de lanzamiento: la app como objeto (concepto)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0d0b18}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c" role="img" aria-label="MConnect: un teléfono se enciende, la interfaz se compone en capas, las capas se separan y todo se pliega en el ícono de la app"></canvas>
<script>
/* kit mínimo de línea de tiempo (inlined en cada demo): draw(t) es función pura del tiempo → grabable y con estado estático */
const C=(v,a=0,b=1)=>v<a?a:v>b?b:v,L=(a,b,t)=>a+(b-a)*t,S=(a,b,t)=>C((t-a)/(b-a));
const bez=(a,b,c,d)=>{const f=(p,q,t)=>3*p*(1-t)*(1-t)*t+3*q*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<24;i++){const v=f(a,c,t);if(Math.abs(v-x)<1e-5)break;v<x?lo=t:hi=t;t=(lo+hi)/2}return f(b,d,t)}};
const sp=(x,f=2,d=6)=>x<=0?0:x>=1?1:1-Math.exp(-d*x)*Math.cos(f*6.2832*x);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fit=c=>{const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]};
/* acabado: grano de película (24 fps), viñeta, micro-shake de impacto */
let _g;const grain=(x,w,h,t,a=.09)=>{if(!_g){_g=document.createElement('canvas');_g.width=_g.height=180;const g=_g.getContext('2d'),d=g.createImageData(180,180),r=rng(9);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=r()*255|0;d.data[i+3]=255}g.putImageData(d,0,0)}
 const r=rng(Math.floor(t*24)+1),ox=r()*180|0,oy=r()*180|0;x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';x.translate(-ox,-oy);x.fillStyle=x.createPattern(_g,'repeat');x.fillRect(ox,oy,w,h);x.restore()};
const vig=(x,w,h,a=.5)=>{const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,w,h)};
const film=t=>{const e=document.getElementById('film');if(e){const r=rng(Math.floor(t*24)+3);e.style.backgroundPosition=`${r()*220|0}px ${r()*220|0}px`}};
const shake=(t,t0,a=6,d=.3)=>{const k=S(t0,t0+d,t);if(k<=0||k>=1)return[0,0];const e=(1-k)*(1-k)*a;return[Math.sin(k*67)*e,Math.cos(k*59)*e]};
const FONTS=()=>document.fonts?Promise.all(['300 40px Display','italic 300 40px Display','500 20px Sans'].map(f=>document.fonts.load(f,'AÁaáÍí0'))):Promise.resolve();
function play(D,draw,o={}){const cap=/[?&]cap/.test(location.search),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,H=o.hold??1500,st=o.still??D,rf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.__D=D;
FONTS().then(()=>{window.__seek=t=>{draw(C(t,0,D));return rf()};
if(cap){draw(0);return}
if(rm){draw(st);addEventListener('resize',()=>draw(st));return}
let t0=performance.now(),on=true;
document.addEventListener('visibilitychange',()=>{on=!document.hidden;t0=performance.now()});
if(o.replay!==false)addEventListener('pointerdown',()=>{t0=performance.now()});
const f=n=>{if(on){const t=(n-t0)%(D+H);draw(C(t,0,D))}requestAnimationFrame(f)};requestAnimationFrame(f)})}
const cv=document.getElementById('c'),PW=330,PH=680,SW=PW-28,SH=PH-28;
const LI='#c6b8ff',PE='#f3bea9',MI='#86e0cf',PI='#ff9db0',INK='#151326',CR='#f3eefc';
const eO=bez(.16,.84,.2,1),eI=bez(.7,0,.15,1),eIO=bez(.65,0,.2,1);
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.roundRect(a,b,w,h,r)};
const M1=new Path2D('M-98 56V-4A49 49 0 0 1 0 -4'),M2=new Path2D('M0 -4A49 49 0 0 1 98 -4V56'),LEN=222;
function mIcon(x,cx,cy,s,t0,t){ // ícono de la app: aproximación (dos arcos y un nodo)
 x.save();x.translate(cx,cy);x.scale(s,s);const g=x.createLinearGradient(-80,-80,80,80);g.addColorStop(0,'#2d2458');g.addColorStop(1,'#151326');
 x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=40;x.shadowOffsetY=18;x.fillStyle=g;rr(x,-90,-90,180,180,44);x.fill();x.shadowColor='transparent';
 x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=1.5;rr(x,-90,-90,180,180,44);x.stroke();
 x.save();x.scale(.68,.68);x.translate(0,-6);x.lineCap='round';x.lineWidth=22;x.setLineDash([LEN,LEN]);
 x.strokeStyle=LI;x.lineDashOffset=LEN*(1-eO(S(t0,t0+.6,t)));x.stroke(M1);x.strokeStyle=PE;x.lineDashOffset=LEN*(1-eO(S(t0+.12,t0+.72,t)));x.stroke(M2);
 x.setLineDash([]);x.fillStyle=MI;x.beginPath();x.arc(0,26,15*sp(S(t0+.3,t0+1,t),1.4,5),0,6.283);x.fill();x.restore();x.restore()}
const pins=[[70,170,LI],[190,120,PE],[140,235,MI],[225,215,PI]];
function contour(x,cx,cy,r,ph){x.beginPath();for(let a=0;a<=6.3;a+=.1){const rr0=r*(1+.12*Math.sin(a*3+ph)+.07*Math.sin(a*5-ph*1.3));a?x.lineTo(cx+Math.cos(a)*rr0,cy+Math.sin(a)*rr0*.8):x.moveTo(cx+Math.cos(a)*rr0,cy+Math.sin(a)*rr0*.8)}x.closePath();x.stroke()}
// capas de la interfaz, en coordenadas de pantalla; ex = separación (0 pegadas · 1 explotadas)
function layers(x,t,ex){
 const L0=eO(S(1.3,2.0,t)),L1=sp(S(1.7,2.6,t),1,5),L2=sp(S(2.6,3.5,t),1,5);
 const lay=(dy,sc,sh,fn)=>{x.save();x.translate(SW/2,SH/2+dy);x.scale(sc,sc);x.translate(-SW/2,-SH/2);x.shadowColor=`rgba(0,0,0,${.5*sh})`;x.shadowBlur=30*sh;x.shadowOffsetY=18*sh;fn();x.restore()};
 // capa 0: fondo
 lay(ex*28,1,ex,()=>{const g=x.createLinearGradient(0,0,0,SH);g.addColorStop(0,'#2a2150');g.addColorStop(1,'#151326');x.fillStyle=g;rr(x,0,0,SW,SH,36);x.fill()});
 // capa 1: mapa
 if(L1>0)lay(L1<1?(1-L1)*420:0,1,0,()=>{});
 const my=(1-L1)*440+ex*-8;if(L1>0)lay(my,1+.035*ex,.6+ex,()=>{x.fillStyle='#1c1840';rr(x,16,104,SW-32,300,26);x.fill();x.save();rr(x,16,104,SW-32,300,26);x.clip();
  x.strokeStyle='rgba(198,184,255,.2)';x.lineWidth=1.4;for(let i=0;i<5;i++)contour(x,150,250,26+i*34,i*.7+t*.15);
  x.strokeStyle='rgba(134,224,207,.3)';x.lineWidth=3;x.beginPath();x.moveTo(16,340);x.bezierCurveTo(100,290,180,380,SW-16,300);x.stroke();
  // conexiones entre presencias + pines con resorte
  x.strokeStyle='rgba(243,238,252,.4)';x.lineWidth=1.5;x.setLineDash([4,6]);const lp=eO(S(2.6,3.3,t));x.beginPath();pins.forEach((p,i)=>{const px=p[0]+16,py=p[1]+104;i?x.lineTo(px,py):x.moveTo(px,py)});x.lineTo(pins[0][0]+16,pins[0][1]+104);if(lp>0){x.globalAlpha=lp;x.stroke();x.globalAlpha=1}x.setLineDash([]);
  pins.forEach((p,i)=>{const d=2.2+i*.12,k=sp(S(d,d+.8,t),1.3,5),px=p[0]+16,py=p[1]+104;const rp=S(d,d+.9,t);if(rp>0&&rp<1){x.strokeStyle=p[2];x.globalAlpha=(1-rp)*.7;x.lineWidth=2;x.beginPath();x.arc(px,py,8+eO(rp)*38,0,6.283);x.stroke();x.globalAlpha=1}
   x.fillStyle=p[2];x.beginPath();x.arc(px,py-(1-k)*60,10*k,0,6.283);x.fill()});x.restore()});
 // capa 2: hoja de chat
 const sy=(1-L2)*320+ex*60;if(L2>0)lay(sy,1+.03*ex,.6+ex,()=>{x.fillStyle='rgba(38,31,72,.97)';rr(x,8,SH-226,SW-16,218,30);x.fill();
  [[22,SH-196,150,30,LI,.9,3.0],[SW-22-120,SH-156,120,30,PE,.9,3.2],[22,SH-116,196,30,LI,.5,3.4]].forEach(([bx,by,bw,bh,c,a,d])=>{const k=eO(S(d,d+.45,t));x.globalAlpha=a*k;x.fillStyle=c;rr(x,bx,by+(1-k)*14,bw,bh,15);x.fill()});x.globalAlpha=1;
  // «escribiendo…»
  [0,1,2].forEach(i=>{x.fillStyle='rgba(243,238,252,.55)';x.beginPath();x.arc(40+i*14,SH-101+Math.sin(t*7+i)*2.5,3.2,0,6.283);x.fill()});
  x.fillStyle='rgba(255,255,255,.08)';rr(x,22,SH-62,SW-44,36,18);x.fill()});
 // capa 3: cabecera
 const hy=(1-L0)*-90+ex*-62;if(L0>0)lay(hy,1+.05*ex,.5+ex,()=>{x.fillStyle='rgba(30,25,58,.9)';rr(x,8,10,SW-16,76,24);x.fill();x.fillStyle=CR;x.font='italic 300 38px Display,serif';x.fillText('Círculo',28,64);
  [LI,PE,MI].forEach((c,i)=>{x.fillStyle=c;x.beginPath();x.arc(SW-34-i*20,48,10,0,6.283);x.fill();x.strokeStyle='#1e193a';x.lineWidth=2.5;x.stroke()})})}
play(8000,t=>{t/=1000;
 const[x,w,h]=fit(cv),k=Math.min(w/1600,h/900);
 x.fillStyle='#0d0b18';x.fillRect(0,0,w,h);x.save();x.translate((w-1600*k)/2,(h-900*k)/2);x.scale(k,k);
 const sh1=shake(t,2.2,5,.3),sh2=shake(t,3.0,3,.25),sh3=shake(t,5.4,9,.4);x.translate(sh1[0]+sh2[0]+sh3[0],sh1[1]+sh2[1]+sh3[1]);
 const bg=x.createRadialGradient(800,420,0,800,420,900);bg.addColorStop(0,'#241d46');bg.addColorStop(1,'#0d0b18');x.fillStyle=bg;x.fillRect(-4000,-4000,9000,9000);
 const ex=eIO(S(4.0,4.7,t))*(1-eIO(S(5.0,5.5,t))),on=eO(S(.8,1.3,t)),out=eIO(S(5.7,6.6,t)),enter=eO(S(0,.9,t));
 // resplandor de la pantalla sobre el fondo
 x.save();x.globalCompositeOperation='screen';const gl=x.createRadialGradient(800,450,0,800,450,520);gl.addColorStop(0,`rgba(120,96,220,${.32*on*(1-out)})`);gl.addColorStop(1,'rgba(120,96,220,0)');x.fillStyle=gl;x.fillRect(-4000,-4000,9000,9000);x.restore();
 // teléfono
 const py=450+(1-enter)*140+out*620;x.save();x.globalAlpha=enter*(1-out);x.translate(800,py);x.transform(1,0,-.2*ex,1,0,0);x.rotate(-.035*ex);
 x.fillStyle='rgba(0,0,0,.4)';x.beginPath();x.ellipse(0,PH/2+34,190,22,0,0,6.283);x.fill();
 const fg=x.createLinearGradient(-PW/2,-PH/2,PW/2,PH/2);fg.addColorStop(0,'#2b2a35');fg.addColorStop(.5,'#0d0c12');fg.addColorStop(1,'#26252f');x.fillStyle=fg;rr(x,-PW/2,-PH/2,PW,PH,54);x.fill();x.strokeStyle='rgba(255,255,255,.2)';x.lineWidth=1.6;rr(x,-PW/2,-PH/2,PW,PH,54);x.stroke();
 x.save();x.translate(-SW/2,-SH/2);x.fillStyle='#000';rr(x,0,0,SW,SH,40);x.fill();
 x.save();rr(x,-ex*70,-ex*70,SW+ex*140,SH+ex*140,40+ex*20);x.clip();x.globalAlpha=on;
 // contenido de la app; se pliega en el ícono a partir de 5.0
 const fold=eIO(S(5.0,5.5,t));x.save();x.translate(SW/2,SH/2);x.scale(1-.55*fold,1-.55*fold);x.translate(-SW/2,-SH/2);x.globalAlpha=on*(1-S(5.2,5.5,t));layers(x,t,ex);x.restore();
 x.restore();x.restore();
 // isla dinámica
 x.fillStyle='#000';rr(x,-46,-PH/2+22,92,26,13);x.fill();x.restore();
 // ícono de la app: nace del teléfono y queda como protagonista
 const ik=S(5.4,6.9,t);if(ik>0){const s=L(.7,1.5,eO(ik)),cy=L(450,410,eIO(S(5.7,6.8,t)));x.save();x.globalAlpha=eO(S(5.4,5.7,t));mIcon(x,800,cy,s*(1+.08*sp(S(5.4,6.2,t),1.4,5)-.08*sp(S(5.4,6.2,t),0,0)),5.45,t);x.restore()}
 const wn=eO(S(6.4,7.3,t));x.save();x.globalAlpha=wn;x.fillStyle=CR;x.font='500 30px Sans,sans-serif';x.textAlign='center';if('letterSpacing'in x)x.letterSpacing=L(34,16,wn)+'px';x.fillText('MCONNECT',800+8,640);if('letterSpacing'in x)x.letterSpacing='0px';x.restore();
 // destello de impacto del ícono
 const fl=1-S(5.4,5.65,t);if(fl>0&&t>=5.4){x.fillStyle=`rgba(243,238,252,${.18*fl})`;x.fillRect(-20,-20,1640,940)}
 x.restore();vig(x,w,h,.55);grain(x,w,h,t,.09)},{hold:1500,still:7600});
</script></body></html>
